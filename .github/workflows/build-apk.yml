
name: Build Betkeiba APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        run: |
          npm install
          npm install @capacitor/android@^7.4.3

      - name: Configure app URL
        env:
          SITE_URL: ${{ vars.BETKEIBA_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Missing BETKEIBA_SITE_URL repository variable"
            exit 1
          fi
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));const u=new URL(process.env.SITE_URL);if(u.protocol!=='https:')throw Error('SITE_URL must use HTTPS');c.appName='Betkeiba';c.server={url:u.origin,cleartext:false,allowNavigation:[u.host]};fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Betkeiba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
